name: Release

# Builds the signed app bundle (.aab) for Google Play, plus a signed .apk to
# install directly on a phone, and uploads the bundle to a Play testing track.
# Runs when a version tag like v1.0.0 is pushed, or by hand from the Actions tab.
#
# Secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD
#                               the upload key (required; scripts/create-upload-key.ps1).
#                               Its alias is "upload", or the ANDROID_KEY_ALIAS
#                               repository variable.
#   PLAY_SERVICE_ACCOUNT_JSON   lets the workflow upload to Play (optional;
#                               scripts/setup-play-upload.ps1; without it,
#                               upload the .aab by hand)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: Version shown on the store, like 1.0.0
        required: true
        default: 1.0.0
      upload_to_play:
        description: Upload to Google Play (needs the PLAY_SERVICE_ACCOUNT_JSON secret)
        type: boolean
        default: true
      track:
        description: Play testing track to upload to
        type: choice
        options: [internal, alpha]
        default: internal

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.kaalam.rasipalan

jobs:
  bundle:
    name: Signed app bundle
    runs-on: ubuntu-latest
    env:
      # Play needs a higher versionCode for every upload; the run number only goes up.
      VERSION_CODE: ${{ github.run_number }}
      # Tag pushes upload to internal testing; manual runs use the inputs.
      TRACK: ${{ inputs.track || 'internal' }}
      # Not a secret: as one, GitHub would hide the word "upload" throughout the logs.
      KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'upload' }}
    steps:
      - name: Check the signing secrets are set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Run scripts/create-upload-key.ps1, or add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Work out the version name
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          INPUT: ${{ inputs.version_name }}
        run: |
          name="${TAG:-$INPUT}"
          name="${name#v}"
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$name' isn't a version like 1.0.0."
            exit 1
          fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      # A release that talks to the emulator's localhost would show nothing on a phone.
      - name: Check release builds point at the deployed API
        run: |
          if ! grep -Eq '^kaalam\.apiBaseUrl=https://' android/gradle.properties; then
            echo "::error::android/gradle.properties doesn't set kaalam.apiBaseUrl to an https:// address, so this build couldn't reach the API."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore the upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Test, then build the app bundle and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew testDebugUnitTest bundleRelease assembleRelease

      # The bundle is what Play needs, so it's checked and kept first; a problem
      # with the APK (a convenience for installing directly) can't hold it up.
      - name: Check the bundle is signed
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" > aab-verify.log 2>&1 || true
          grep "jar verified" aab-verify.log || { cat aab-verify.log; exit 1; }
          mkdir -p out
          mv "$aab" "out/kaalam-$VERSION_NAME-$VERSION_CODE.aab"

      - name: Check the APK is signed
        id: apk
        continue-on-error: true
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          status=0
          "$apksigner" verify --verbose --print-certs "$apk" > apk-verify.log 2>&1 || status=$?
          cat apk-verify.log
          [ "$status" -eq 0 ] || { echo "::error::apksigner exit code $status"; exit 1; }
          mv "$apk" "out/kaalam-$VERSION_NAME-$VERSION_CODE.apk"

      - name: Forget the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: kaalam-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: out/
          if-no-files-found: error

      - name: Check for a Play upload key
        id: play
        env:
          KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          WANTED: ${{ github.ref_type == 'tag' || inputs.upload_to_play }}
        run: |
          if [ "$WANTED" != "true" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$KEY" ]; then
            echo "::warning::No PLAY_SERVICE_ACCOUNT_JSON secret, so the bundle wasn't uploaded. Upload it by hand in Play Console, or run scripts/setup-play-upload.ps1."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Google Play
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: out/*.aab
          releaseName: ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})
          tracks: ${{ env.TRACK }}
          status: completed

      - name: Summary
        env:
          UPLOADED: ${{ steps.play.outputs.upload }}
          APK: ${{ steps.apk.outcome }}
        run: |
          {
            echo "### Kaalam $VERSION_NAME (version code $VERSION_CODE)"
            echo
            if [ "$UPLOADED" = "true" ]; then
              echo "Uploaded to the **$TRACK** track on Google Play."
            else
              echo "Not uploaded. Download the bundle from **Artifacts** below and upload it in Play Console → Test and release."
            fi
            echo
            if [ "$APK" = "success" ]; then
              echo "The **.apk** in the artifact installs directly on a phone. Uninstall any debug or Play-installed copy first: they're signed differently."
            else
              echo "⚠ The .apk didn't pass its signature check, so it was left out (see the \"Check the APK is signed\" step). The bundle is fine."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
