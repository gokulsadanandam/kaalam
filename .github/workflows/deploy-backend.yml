name: Deploy backend

# Deploys the Supabase side whenever backend/ changes on main: runs the tests,
# applies any new SQL migrations (already-applied ones are skipped), then
# deploys the `kaalam` Edge Function. Also runs by hand from the Actions tab.
#
# Secrets (set with scripts/set-deploy-secrets.ps1):
#   SUPABASE_ACCESS_TOKEN   a personal access token from
#                           https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    the database password (backend/.env), for db push
# Function secrets (CRON_SECRET etc.) live in Supabase and aren't touched.

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'tvswkokrxjwwpxdtohgo' }}
  # The CLI version the project was set up and deployed with locally.
  SUPABASE_CLI: supabase@3.1.0

jobs:
  deploy:
    name: Test and deploy to Supabase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check the deploy secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        working-directory: .
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Run scripts/set-deploy-secrets.ps1, or add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

      - name: Link the Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --yes "$SUPABASE_CLI" link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Apply new migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --yes "$SUPABASE_CLI" db push --remote --yes

      - name: Deploy the Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes "$SUPABASE_CLI" functions deploy kaalam --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Check the deployed API answers
        working-directory: .
        run: |
          url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/kaalam/health"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$url"; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::$url didn't answer after the deploy."
          exit 1

      - name: Summary
        working-directory: .
        run: |
          {
            echo "### Backend deployed"
            echo
            echo "Project \`$SUPABASE_PROJECT_REF\`, commit \`${GITHUB_SHA::7}\`."
            echo "API: https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/kaalam"
          } >> "$GITHUB_STEP_SUMMARY"
