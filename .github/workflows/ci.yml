name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  android:
    name: Android tests and debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # The same signed bundle and APK as the Release workflow, with a throwaway
      # key, so release signing (and R8 shrinking) is known to work before a real release.
      - name: Check release signing with a throwaway key
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/throwaway.jks
          ANDROID_KEYSTORE_PASSWORD: throwaway
          ANDROID_KEY_ALIAS: ci
          ANDROID_KEY_PASSWORD: throwaway
          VERSION_CODE: 2
          VERSION_NAME: 0.0.0-ci
        run: |
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" -alias ci -keyalg RSA -keysize 2048 \
            -validity 1 -storepass throwaway -keypass throwaway -dname "CN=CI"
          ./gradlew bundleRelease assembleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
